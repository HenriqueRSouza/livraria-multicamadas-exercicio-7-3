<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1600" height="960" fill="#ffffff"/>
  <text x="800" y="54" text-anchor="middle" font-size="34" font-weight="bold" fill="#111827">Livraria — Arquitetura Multicamadas</text>

  <circle cx="540" cy="520" r="400" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <circle cx="540" cy="520" r="305" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <circle cx="540" cy="520" r="210" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <circle cx="540" cy="520" r="115" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <g text-anchor="middle" fill="#111827">
    <text x="540" y="168" font-size="24" font-weight="bold">Apresentação</text>
    <text x="540" y="196" font-size="19">routes/ + templates/</text>
    <text x="540" y="262" font-size="24" font-weight="bold">Aplicação</text>
    <text x="540" y="290" font-size="19">controllers/</text>
    <text x="540" y="356" font-size="24" font-weight="bold">Negócio</text>
    <text x="540" y="384" font-size="19">models/</text>
    <text x="540" y="508" font-size="24" font-weight="bold">Dados</text>
    <text x="540" y="536" font-size="19">db/ (SQLite)</text>
  </g>

  <line x1="160" y1="600" x2="420" y2="600" stroke="#000000" stroke-width="10" marker-start="url(#seta)" marker-end="url(#seta)"/>

  <g fill="#111827" font-size="20">
    <text x="1010" y="170" font-size="24" font-weight="bold">Camada → pasta → o que faz</text>
    <rect x="1010" y="200" width="26" height="26" fill="#f8cecc" stroke="#b85450"/>
    <text x="1050" y="221"><tspan font-weight="bold">Apresentação</tspan> — routes/, templates/</text>
    <text x="1050" y="248" font-size="17" fill="#374151">recebe a requisição HTTP e mostra a página</text>
    <rect x="1010" y="290" width="26" height="26" fill="#fff2cc" stroke="#d6b656"/>
    <text x="1050" y="311"><tspan font-weight="bold">Aplicação</tspan> — controllers/</text>
    <text x="1050" y="338" font-size="17" fill="#374151">organiza cada operação (reservar, avaliar...)</text>
    <rect x="1010" y="380" width="26" height="26" fill="#d5e8d4" stroke="#82b366"/>
    <text x="1050" y="401"><tspan font-weight="bold">Negócio</tspan> — models/</text>
    <text x="1050" y="428" font-size="17" fill="#374151">regras: preço, estoque, reserva, pontos, nota 1–5</text>
    <rect x="1010" y="470" width="26" height="26" fill="#ffffff" stroke="#000000"/>
    <text x="1050" y="491"><tspan font-weight="bold">Dados</tspan> — db/</text>
    <text x="1050" y="518" font-size="17" fill="#374151">conexão SQLite e consultas SQL</text>

    <text x="1010" y="600" font-size="22" font-weight="bold">Comunicação bem definida</text>
    <text x="1010" y="632" font-size="18" fill="#374151">cada camada só conversa com a vizinha:</text>
    <text x="1010" y="660" font-size="18" fill="#374151">routes → controllers → models / db</text>

    <text x="1010" y="740" font-size="22" font-weight="bold">Nova feature</text>
    <text x="1010" y="772" font-size="18" fill="#374151">avaliações de clientes (nota 1–5 e comentário),</text>
    <text x="1010" y="800" font-size="18" fill="#374151">passando pelas 4 camadas</text>
  </g>
</svg>
